name: Apply authoring upgrade

on:
  push:
    branches:
      - feature/compact-godot-workspace
    paths:
      - tools/apply_authoring_upgrade.py
      - .github/workflows/apply-authoring-upgrade.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/compact-godot-workspace
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply source upgrade
        run: python tools/apply_authoring_upgrade.py

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: advanced world authoring and logic resource management"
          git push origin HEAD:feature/compact-godot-workspace
