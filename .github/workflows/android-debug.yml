name: Android debug APK

on:
  push:
    branches:
      - feature/compact-godot-workspace
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare sequential source patcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_authoring_upgrade.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              '    if count != 1:\n        raise RuntimeError(f"{path}: expected one exact match, found {count}: {old[:120]!r}")',
              '    if count < 1:\n        raise RuntimeError(f"{path}: expected an exact match, found {count}: {old[:120]!r}")',
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY

      - name: Apply advanced authoring source upgrade
        run: python tools/apply_authoring_upgrade.py

      - name: Persist generated source changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "feat: advanced world authoring and logic resource management"
            git push origin HEAD:feature/compact-godot-workspace
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-game-studio-godot-workspace-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
