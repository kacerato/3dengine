name: Android debug APK

on:
  push:
    branches:
      - master
      - feature/compact-godot-workspace
      - feature/world-studio-direct-editing
      - feature/native-editor-validation-v1
      - feature/world-studio-v4-foundation
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply legacy generated migrations
        if: github.head_ref != 'feature/world-studio-v4-foundation' && github.ref_name != 'feature/world-studio-v4-foundation'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('tools/apply_authoring_upgrade.py')
          source = path.read_text(encoding='utf-8')
          old = '''def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one exact match, found {count}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))
          '''.replace('          ', '')
          new = '''def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              if old in text:
                  write(path, text.replace(old, new, 1))
                  return
              chunks = re.split(r"(\s+)", old)
              pattern = "".join(r"\s+" if chunk.isspace() else re.escape(chunk) for chunk in chunks if chunk)
              updated, count = re.subn(pattern, lambda _: new, text, count=1, flags=re.MULTILINE | re.DOTALL)
              if count < 1:
                  raise RuntimeError(f"{path}: expected a tolerant match: {old[:120]!r}")
              write(path, updated)
          '''.replace('          ', '')
          if old in source:
              path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          python tools/apply_authoring_upgrade.py
          python tools/apply_authoring_hotfix.py
          python tools/apply_world_studio_v2.py
          python tools/apply_world_studio_compile_hotfix.py
          python tools/apply_studio_v3_geometry.py
          python tools/apply_studio_v3_ui.py
          python tools/apply_studio_v3_validation.py
          python tools/apply_native_editor_validation.py
          python tools/apply_world_authoring_v2_fixed.py

      - name: Verify persisted World Studio source
        if: github.head_ref == 'feature/world-studio-v4-foundation' || github.ref_name == 'feature/world-studio-v4-foundation'
        shell: bash
        run: |
          test -f core/model/src/main/kotlin/com/mobilegamestudio/core/model/WorldLayerModels.kt
          test -f core/model/src/main/kotlin/com/mobilegamestudio/core/model/WorldAuthoringContext.kt
          test -f editor/src/main/kotlin/com/mobilegamestudio/editor/WorldStudioV4Panels.kt
          test -f editor/src/main/kotlin/com/mobilegamestudio/editor/WorldStudioWorkspaceV5.kt
          grep -q "fun createWorldLayer" editor/src/main/kotlin/com/mobilegamestudio/editor/WorkspaceViewModel.kt
          echo "World Studio persisted source is available"

      - name: Apply World Studio validation and V5 workspace
        shell: bash
        run: |
          if ! grep -q "isEditable = mode == EditorMode.EDITOR && transformGesturesEnabled" runtime/src/main/kotlin/com/mobilegamestudio/runtime/RuntimeSceneViewport.kt; then
            python tools/apply_world_studio_v4_validation_fixes.py
          else
            echo "Base viewport validation fixes already persisted"
          fi
          if ! grep -q "WorldStudioV4InlineDock" editor/src/main/kotlin/com/mobilegamestudio/editor/GodotCompactEditorShell.kt; then
            python tools/apply_world_studio_v4_validation_round2.py
          else
            echo "World Studio inline source already persisted"
          fi
          python tools/apply_world_studio_v4_freecam_cleanup.py
          python tools/apply_world_studio_v4_color_fix.py
          python tools/apply_world_studio_v5_dedicated.py
          ! grep -R "colorArgb.toULong()" editor/src/main/kotlin
          ! grep -R "EditorCameraDock(" editor/src/main/kotlin/com/mobilegamestudio/editor/SceneViewport.kt
          ! grep -R "onDoubleTap = { _, node ->" runtime/src/main/kotlin/com/mobilegamestudio/runtime/RuntimeSceneViewport.kt
          grep -q "WorldStudioWorkspaceV5(" editor/src/main/kotlin/com/mobilegamestudio/editor/GodotCompactEditorShell.kt

      - name: Persist World Studio source changes
        if: github.event_name == 'push' && github.ref_name == 'feature/world-studio-v4-foundation'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/main/kotlin/com/mobilegamestudio/editor runtime/src/main/kotlin/com/mobilegamestudio/runtime
          if git diff --cached --quiet; then
            echo "World Studio source already persisted"
          else
            git commit -m "feat: activate dedicated responsive World Studio V5"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Persist legacy generated source changes
        if: github.event_name == 'push' && github.ref_name != 'feature/world-studio-v4-foundation'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "feat: generated editor source updates"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-game-studio-world-studio-v5-dedicated-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
