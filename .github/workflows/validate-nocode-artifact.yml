name: Validate NoCode APK artifact

on:
  push:
    branches:
      - feature/mgs-nocode-foundation
    paths:
      - '.github/workflows/validate-nocode-artifact.yml'
  pull_request:
    branches:
      - feature/godot-editor-refoundation-clean
    paths:
      - '.github/workflows/validate-nocode-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_RUN_ID: '30753366116'
      SOURCE_ARTIFACT_ID: '8835463126'
      EXPECTED_SOURCE_SHA: 'd7c46582a446cbdc69e72f840a2af41665fa2a3b'
      EXPECTED_LOGO_SHA256: '0538d32f34d0b9a3a5f2fb4f1e1d8ae3d003360f4fedf093b57aa7f8f20b9da1'
      ANDROID_BUILD_TOOLS_VERSION: '36.1.0'

    steps:
      - name: Checkout validation source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android validation tools
        shell: bash
        run: |
          sdkmanager "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Download successful NoCode build artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            --output nocode-artifact.zip
          unzip -q nocode-artifact.zip -d artifact
          test -s artifact/MobileGameStudio-NoCode-Foundation.apk
          test -s artifact/MobileGameStudio-NoCode-Foundation.aab

      - name: Validate APK package signature alignment and NoCode
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/artifact/MobileGameStudio-NoCode-Foundation.apk"
          AAB="$GITHUB_WORKSPACE/artifact/MobileGameStudio-NoCode-Foundation.aab"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS_VERSION"

          unzip -t "$APK" > apk-unzip-test.txt
          unzip -t "$AAB" > aab-unzip-test.txt

          "$BUILD_TOOLS/aapt2" dump badging "$APK" | tee apk-badging.txt
          grep -Fq "package: name='com.mobilegamestudio.editor'" apk-badging.txt
          grep -Fq "application-label:'Mobile Game Studio'" apk-badging.txt
          grep -Fq "native-code: 'arm64-v8a'" apk-badging.txt

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -Eq 'Verified using v[23] scheme.*true' apk-signature.txt

          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK" | tee apk-alignment.txt

          mkdir -p extracted
          unzip -q "$APK" 'lib/arm64-v8a/libgodot_android.so' 'res/drawable-nodpi-v4/mobile_game_studio_logo.webp' -d extracted
          test "$(sha256sum extracted/res/drawable-nodpi-v4/mobile_game_studio_logo.webp | cut -d' ' -f1)" = "$EXPECTED_LOGO_SHA256"

          strings extracted/lib/arm64-v8a/libgodot_android.so > native-strings.txt
          for symbol in MGSNoCodeGraph MGSNoCodeRunner 'Mobile Game Studio NoCode' event.scene.start flow.branch variable.set transform.rotate.y; do
            grep -Fq "$symbol" native-strings.txt
          done

          file extracted/lib/arm64-v8a/libgodot_android.so | tee native-architecture.txt
          grep -Fq 'ARM aarch64' native-architecture.txt

          {
            echo "Mobile Game Studio NoCode APK validation: PASS"
            echo "Source run: $SOURCE_RUN_ID"
            echo "Source commit: $EXPECTED_SOURCE_SHA"
            echo "APK SHA-256: $(sha256sum "$APK" | cut -d' ' -f1)"
            echo "AAB SHA-256: $(sha256sum "$AAB" | cut -d' ' -f1)"
            echo "Logo SHA-256: $EXPECTED_LOGO_SHA256"
            echo "Package: com.mobilegamestudio.editor"
            echo "Label: Mobile Game Studio"
            echo "ABI: arm64-v8a"
            echo "NoCode native classes and executable node identifiers: present"
            echo "APK signature: verified by apksigner"
            echo "APK alignment: verified by zipalign"
          } | tee validation-report.txt

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nocode-apk-validation-report
          path: |
            validation-report.txt
            apk-badging.txt
            apk-signature.txt
            apk-alignment.txt
            native-architecture.txt
            apk-unzip-test.txt
            aab-unzip-test.txt
          if-no-files-found: warn
          retention-days: 14
